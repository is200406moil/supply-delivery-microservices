server:
  port: 8080

spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  rabbitmq:
    host: ${RABBIT_HOST:rabbitmq}
    username: ${RABBIT_USER}
    password: ${RABBIT_PASSWORD}
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3

supplier:
  url: ${SUPPLIER_URL:http://supplier-service:8080}
  read-timeout: 2s

resilience4j:
  retry:
    instances:
      supplier:
        max-attempts: 3
        wait-duration: 300ms
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
        ignore-exceptions:
          - ru.mirea.p8.order.Contracts$ApiException
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
  circuitbreaker:
    instances:
      supplier:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 6
        minimum-number-of-calls: 4
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
        allow-health-indicator-to-fail: false
        ignore-exceptions:
          - ru.mirea.p8.order.Contracts$ApiException

management:
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,prometheus
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [rid=%X{requestId:-----}] %-22.22logger{0} : %msg%n"
  level:
    org.springframework.amqp.rabbit.listener.ConditionalRejectingErrorHandler: ERROR

# Prometheus собирает метрики Micrometer с /actuator/prometheus каждого сервиса.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - api-gateway:8080
          - supplier-service:8080
          - order-service:8080
          - delivery-service:8080

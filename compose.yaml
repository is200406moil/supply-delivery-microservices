name: food-micro

x-service-health: &service-health
  test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
  interval: 5s
  timeout: 3s
  start_period: 60s
  retries: 20

services:

  # ================================================================ инфраструктура
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      SUPPLIERS_DB_PASSWORD: ${SUPPLIERS_DB_PASSWORD}
      ORDERS_DB_PASSWORD: ${ORDERS_DB_PASSWORD}
      DELIVERIES_DB_PASSWORD: ${DELIVERIES_DB_PASSWORD}
    volumes:
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD}
    ports:
      - "127.0.0.1:${RABBIT_UI_PORT}:15672"   # management UI — только для наблюдения
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  # ================================================================ бизнес-сервисы
  supplier-service:
    build: ./supplier-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/suppliers_db
      DB_USER: suppliers
      DB_PASSWORD: ${SUPPLIERS_DB_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck: *service-health
    networks: [internal]

  order-service:
    build: ./order-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/orders_db
      DB_USER: orders
      DB_PASSWORD: ${ORDERS_DB_PASSWORD}
      RABBIT_USER: ${RABBIT_USER}
      RABBIT_PASSWORD: ${RABBIT_PASSWORD}
      SUPPLIER_URL: http://supplier-service:8080
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck: *service-health
    networks: [internal]

  delivery-service:
    build: ./delivery-service
    environment:
      DB_URL: r2dbc:postgresql://postgres:5432/deliveries_db
      DB_USER: deliveries
      DB_PASSWORD: ${DELIVERIES_DB_PASSWORD}
      RABBIT_USER: ${RABBIT_USER}
      RABBIT_PASSWORD: ${RABBIT_PASSWORD}
      DELIVERY_STEP: ${DELIVERY_STEP}
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck: *service-health
    networks: [internal]

  # ================================================================ точка входа
  api-gateway:
    build: ./api-gateway
    depends_on:
      supplier-service: { condition: service_healthy }
      order-service: { condition: service_healthy }
      delivery-service: { condition: service_healthy }
    healthcheck: *service-health
    labels:
      - traefik.enable=true
      - traefik.http.routers.gateway.rule=PathPrefix(`/`)
      - traefik.http.routers.gateway.entrypoints=web
      - traefik.http.services.gateway.loadbalancer.server.port=8080
      - traefik.http.services.gateway.loadbalancer.healthcheck.path=/actuator/health
      - traefik.http.services.gateway.loadbalancer.healthcheck.interval=5s
    networks: [internal, edge]

  traefik:
    image: traefik:v3.6
    command:
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=food-micro_edge
      - --entrypoints.web.address=:80
      - --accesslog=true
    ports:
      - "${TRAEFIK_PORT}:80"
      - "127.0.0.1:${TRAEFIK_DASHBOARD_PORT}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      api-gateway: { condition: service_healthy }
    networks: [edge]

  # ================================================================ мониторинг
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT}:9090"
    depends_on:
      api-gateway: { condition: service_healthy }
    networks: [internal]

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT}:3000"
    depends_on:
      - prometheus
    networks: [internal]

networks:
  internal:   # сервисы, БД и брокер — снаружи недоступны
  edge:       # Traefik ↔ API Gateway

volumes:
  pg-data:
